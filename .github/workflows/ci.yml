name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar testes com cobertura
        run: pytest --cov=. --cov-report=term --cov-report=xml:coverage.xml

  docker:
    name: Docker build e smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: |
          docker build \
            --build-arg APP_VERSION="${{ github.run_number }}" \
            --build-arg GIT_COMMIT="${{ github.sha }}" \
            -t fiap-devops-gs1:ci .

      - name: Subir o container e testar os endpoints
        run: |
          docker run -d --name fiap-devops-gs1-ci -p 8000:8000 fiap-devops-gs1:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/api/status | grep -q '"build":"#${{ github.run_number }}"'
          curl -fsS http://localhost:8000/ | grep -q 'Hello Azure'

      - name: Logs do container
        if: always()
        run: docker logs fiap-devops-gs1-ci || true

  compose:
    name: Validar as composes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        run: |
          docker compose -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.prod.yml config -q
          cp jenkins-sonar-installation/.env.example jenkins-sonar-installation/.env
          docker compose -f jenkins-sonar-installation/docker-compose.yaml --project-directory jenkins-sonar-installation config -q
